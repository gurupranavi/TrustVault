{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card center"><h1>{{ code }}</h1>
<p class="lead">{{ "Access denied" if code==403 else "Something went wrong" }}</p>
<p>{{ msg }}</p>
<p><a class="btn" href="{{ url_for('index') }}">Back to home</a></p></div>
{% endblock %}
