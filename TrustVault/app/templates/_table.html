<div class="tablewrap"><table>
  <tr><th>Title</th><th>Category</th><th>Size</th><th>Owner</th><th>Uploaded</th>{% if perm %}<th>Access</th>{% endif %}</tr>
  {% for d in rows %}
  <tr><td><a href="{{ url_for('doc', doc_id=d.id) }}">{{ d.title }}</a><br><span class="muted sm">{{ d.filename }}</span></td>
  <td>{{ d.category }}</td><td>{{ d.size|filesize }}</td><td>{{ d.owner_name }}</td><td>{{ d.created_at[:10] }}</td>
  {% if perm %}<td><span class="tag">{{ d.permission }}</span></td>{% endif %}</tr>
  {% else %}<tr><td colspan="6" class="muted">{{ empty }}</td></tr>{% endfor %}
</table></div>
